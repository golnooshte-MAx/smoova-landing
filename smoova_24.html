  <style>
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ===== Film grain overlay ===== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .italic-display { font-style: italic; font-family: 'Fraunces', serif; font-weight: 400; }

    /* ===== Cinematic line (mask) ===== */
    .line-mask { display: block; overflow: hidden; padding-bottom: 0.05em; }
    .line-mask > span {
      display: block;
      transform: translateY(110%);
      animation: lineUp 1.1s cubic-bezier(0.19, 1, 0.22, 1) both;
    }
    @keyframes lineUp { to { transform: translateY(0); } }

    /* ===== Hero slideshow ===== */
    .hero-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      animation: heroSlide 25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      will-change: opacity;
    }
    .hero-slide:nth-child(1) { animation-delay: 0s; }
    .hero-slide:nth-child(2) { animation-delay: 5s; }
    .hero-slide:nth-child(3) { animation-delay: 10s; }
    .hero-slide:nth-child(4) { animation-delay: 15s; }
    .hero-slide:nth-child(5) { animation-delay: 20s; }

    @keyframes heroSlide {
      0%, 16%  { opacity: 1; }
      20%, 96% { opacity: 0; }
      100%     { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-slide { animation: none; opacity: 0; }
      .hero-slide:nth-child(1) { opacity: 1; }
    }


    .hairline { background: rgba(15, 23, 42, 0.12); height: 1px; }
    .ledger-rule { background: #0F172A; height: 1px; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* ===== Range slider ===== */
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 2px;
      background: rgba(15, 23, 42, 0.12);
      outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #0369A1;
      cursor: pointer;
      box-shadow: 0 0 0 4px rgba(3, 105, 161, 0.18);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 0 8px rgba(3, 105, 161, 0.22);
      transform: scale(1.1);
    }
    input[type="range"]::-webkit-slider-thumb { cursor: grab; }
    input[type="range"]:active::-webkit-slider-thumb { cursor: grabbing; }
    input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #0369A1; cursor: pointer; border: none;
    }

    /* ===== Link underline ===== */
    .link-underline { position: relative; display: inline-block; }
    .link-underline::after {
      content: '';
      position: absolute; left: 0; bottom: -2px;
      width: 100%; height: 1px;
      background: currentColor;
      transform: scaleX(0); transform-origin: right;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .link-underline:hover::after { transform: scaleX(1); transform-origin: left; }

    /* Primary CTA: simple hover lift only (shimmer removed per audit) */
    .cta-primary {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s;
    }
    .cta-primary:hover { transform: translateY(-2px); }

    /* ===== Pricing cards hover ===== */
    .price-card {
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.6s, box-shadow 0.6s;
    }
    .price-card:hover {
      transform: translateY(-6px);
      border-color: rgba(3, 105, 161, 0.5);
      box-shadow: 0 20px 40px -16px rgba(15, 23, 42, 0.10);
    }

    /* ===== Marquee ===== */
    .marquee-wrap {
      overflow: hidden;
      mask-image: linear-gradient(90deg, transparent, black 8%, black 92%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, black 8%, black 92%, transparent);
    }
    .marquee {
      display: flex; gap: 4rem;
      white-space: nowrap;
      animation: scroll 50s linear infinite;
      width: max-content;
    }
    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .compare-row { transition: background-color 0.4s; }
    .compare-row:hover { background-color: rgba(15, 23, 42, 0.04); }

    .num-pulse { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .num-pulse.pulse { transform: scale(1.04); }

    /* ===== Calculator section soul =====
       Section-scoped emotional gradient: warm red wash on the indictment side (top-right),
       cool sky wash on the savings side (bottom-left). Paper grain for tactile warmth. */
    #calculator {
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }
    #calculator::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 78% 14%, rgba(166, 46, 27, 0.11), transparent 62%),
        radial-gradient(ellipse 65% 50% at 18% 90%, rgba(3, 105, 161, 0.09), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    /* Subtle paper grain — analog warmth on a digital surface */
    #calculator::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml;utf8,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.06  0 0 0 0 0.09  0 0 0 0 0.16  0 0 0 0.5 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.07;
      pointer-events: none;
      mix-blend-mode: multiply;
      z-index: 0;
    }
    #calculator > * { position: relative; z-index: 1; }

    /* The bleed: visceral rust-red on the indictment number, scoped to calc only */
    #calculator .text-bleed { color: #A62E1B; }
    #calculator .text-bleed-soft { color: rgba(166, 46, 27, 0.7); }

    /* Hand-drawn calligraphic flourish under the indictment */
    .flourish {
      display: block;
      width: 100%;
      max-width: 13rem;
      height: auto;
      margin-top: 0.35rem;
      pointer-events: none;
      opacity: 0.7;
    }
    .flourish path {
      stroke: #A62E1B;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ===== Digit tumbler (Vegas departure-board feel) =====
       Fixed-width slots prevent layout reflow as digits change.
       Short transition prevents wobble during continuous slider drag. */
    .digit-tumbler {
      display: inline-flex;
      align-items: baseline;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .digit-tumbler > span {
      display: inline-block;
      vertical-align: top;
    }
    .digit-slot {
      display: inline-block;
      vertical-align: top;
      overflow: hidden;
      height: 1em;
      width: 0.58em;
      line-height: 1;
      text-align: center;
    }
    .digit-reel {
      display: block;
      transition: transform 320ms cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    .digit-reel > span {
      display: block;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      width: 0.58em;
      text-align: center;

    @media (prefers-reduced-motion: reduce) {
      .digit-reel { transition: none; }

    input[type="range"] {
      transition: background 220ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .savings-band {
      transition: box-shadow 700ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .savings-band.milestone {
      box-shadow:
        0 0 0 1px rgba(3, 105, 161, 0.45),
        0 0 0 5px rgba(3, 105, 161, 0.18),
        0 0 30px -8px rgba(3, 105, 161, 0.4);

    @media (prefers-reduced-motion: reduce) {
      .savings-band { transition: none; }

    .cream-paper {
      background-color: #f0e8d9;
      background-image: repeating-linear-gradient(
        to bottom,

        transparent 47px,
        rgba(74, 56, 32, 0.07) 47px,
        rgba(74, 56, 32, 0.07) 48px

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,

    .work-row {
      display: flex;
      gap: 32px;
      overflow-x: auto;
      /* clip (not hidden/auto) — doesn't create a scroll container on Y,

      scrollbar-width: none;
      padding-left: 1.5rem;   /* matches px-6 */
      padding-right: 1.5rem;
      padding-top: 16px;      /* breathing room for translateY(-8px) lift */
      padding-bottom: 24px;   /* breathing room for box-shadow below */
      scroll-padding-left: 1.5rem;
    }
    .work-row::-webkit-scrollbar { display: none; }
    @media (min-width: 768px) {
      .work-row {
        padding-left: 3rem;   /* matches md:px-12 */
        padding-right: 3rem;
        scroll-padding-left: 3rem;
      }
    }
    @media (min-width: 1024px) {
      .work-row {
        padding-left: 5rem;   /* matches lg:px-20 */
        padding-right: 5rem;
        scroll-padding-left: 5rem;
      }
    }

    .work-card {
      flex: 0 0 480px;
      height: 600px;
      border-radius: 28px;
      scroll-snap-align: start;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      z-index: 1; /* default stacking; lifted card goes to z-index:2 so shadow clears siblings */
      transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 300ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (max-width: 767px) {
      .work-card {
        flex: 0 0 75vw;
        height: auto;
        aspect-ratio: 4 / 5;
      }
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      .work-card {
        flex: 0 0 400px;
        height: 500px;
        border-radius: 24px;
      }
    }
    /* Hover: lift + shadow. Fine-pointer (desktop) only — no effect on touch. */
    @media (hover: hover) {
      .work-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.15);
        z-index: 2; /* shadow renders above adjacent cards, not behind them */
      }
      .work-card:hover .work-card-plus {
        transform: scale(1.08);
      }
    }
    .work-card-plus {
      transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .work-card-inner {
      padding: 20px;
    }
    @media (min-width: 768px) {
      .work-card-inner { padding: 36px; }
    }
    @media (min-width: 1024px) {
      .work-card-inner { padding: 44px; }
    }
    /* + button: absolute bottom-right, matching inner padding values */
    .work-card-plus-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      /* explicit size so we can scale up at desktop — overrides Tailwind w-10 h-10 */
      width: 40px;
      height: 40px;
    }
    @media (min-width: 768px) {
      .work-card-plus-btn {
        bottom: 36px;
        right: 36px;
        width: 52px;
        height: 52px;
      }
    }
    @media (min-width: 1024px) {
      .work-card-plus-btn {
        bottom: 44px;
        right: 44px;
      }
    }
    .work-card-headline {
      font-size: 1.375rem; /* ~22px mobile */
      line-height: 1.2;
    }
    @media (min-width: 768px) {
      .work-card-headline { font-size: 1.875rem; } /* ~30px tablet */
    }
    @media (min-width: 1024px) {
      .work-card-headline { font-size: 2.25rem; } /* ~36px desktop */
    }
    /* Background watermark number — scales with card */
    .work-card-num {
      font-size: 7rem;
      color: rgba(248, 250, 252, 0.06);
    }
    @media (min-width: 768px) {
      .work-card-num { font-size: 8.75rem; } /* 7 × (400/320) — tablet */
    }
    @media (min-width: 1024px) {
      .work-card-num { font-size: 10.5rem; } /* 7 × (480/320) — desktop */
    }

    /* ===== Selected Work — modal ===== */
    .work-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .work-modal {
      position: relative;
      background: #f0e8d9;
      border-radius: 24px;
      max-width: 1200px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 3rem;
      /* Enter: auto-plays from display:none → block each open */
      animation: workModalIn 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* === Close button bar: desktop absolute, mobile sticky === */
    .work-modal-close-bar {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 10;
    }
    .work-modal-close {
      width: 2.5rem;   /* 40px desktop */
      height: 2.5rem;
      background: transparent;
    }

    /* === Hero image: desktop max-width cap, mobile full-width + rounded === */
    .work-modal-hero-img {
      display: block;
      width: 100%;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    /* === Mobile entrance keyframe — iOS sheet spring === */
    @keyframes workModalInMobile {
      from { opacity: 0; transform: translateY(100%); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== Mobile modal: full-screen takeover ===== */
    @media (max-width: 767px) {
      /* Backdrop: transparent + non-interactive. Must NOT be display:none —
         that would hide its child .work-modal too. Keep it in the DOM so
         Alpine's x-show can manage it, just make it invisible. */
      .work-modal-backdrop {
        background: transparent !important;
        pointer-events: none;
        padding: 0;
      }
      /* Kill the bg-color enter/leave transitions on mobile — stays transparent */
      .work-backdrop-enter-end   { background-color: transparent !important; }
      .work-backdrop-leave-start { background-color: transparent !important; }

      /* Modal: full-screen fixed layer — independent of backdrop's flex layout */
      .work-modal {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;               /* dvh handles iOS Safari address-bar shift */
        border-radius: 0;
        max-width: none;
        max-height: none;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        pointer-events: auto;
        /* Padding clears safe areas + the fixed close button (top ~76px) */
        padding-top: max(calc(env(safe-area-inset-top, 0px) + 76px), 76px);
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
        padding-left: calc(env(safe-area-inset-left, 0px) + 24px);
        padding-right: calc(env(safe-area-inset-right, 0px) + 24px);
        /* iOS sheet spring — matches Apple's UIKit sheet presentation */
        animation: workModalInMobile 480ms cubic-bezier(0.32, 0.72, 0, 1) both;
      }

      /* Mobile leave: sheet slides back down */
      .work-modal-leave       { transition: opacity 300ms cubic-bezier(0.4, 0, 1, 1),
                                            transform 300ms cubic-bezier(0.4, 0, 1, 1); }
      .work-modal-leave-start { opacity: 1; transform: translateY(0); }
      .work-modal-leave-end   { opacity: 0; transform: translateY(100%); }

      /* Close button: fixed to viewport top-right, always visible while scrolling.
         position:fixed inside a display:none parent is still hidden — so it
         disappears correctly when the modal closes via x-show. */
      .work-modal-close-bar {
        position: fixed;
        top: max(env(safe-area-inset-top, 0px), 16px);
        right: max(env(safe-area-inset-right, 0px), 16px);
        z-index: 60;
      }
      .work-modal-close {
        width: 44px;
        height: 44px;
        background: rgba(240, 232, 217, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      /* Hero image: full-width with subtle rounding on mobile */
      .work-modal-hero-img {
        max-width: 100%;
        border-radius: 12px;
        margin-top: 32px;
      }

      /* ---- Modal content typography (mobile) ---- */

      /* Eyebrow: fixed UI element, doesn't need to scale */
      .work-modal-eyebrow-mobile {
        font-size: 11px;
      }

      /* Headline: scales with viewport, slightly smaller than desktop */
      .work-modal-headline-mobile {
        font-size: clamp(2rem, 8vw, 2.75rem) !important;
        line-height: 1.1;
        margin-top: 12px;
        margin-bottom: 1.5rem;
      }

      /* Body copy: comfortable mobile reading size */
      .work-modal-body-mobile {
        font-size: 17px !important;
        line-height: 1.5;
        margin-top: 24px;
      }

      /* Caption: small, with room for home indicator */
      .work-modal-caption-mobile {
        font-size: 11px;
        margin-top: 16px;
        margin-bottom: 80px;
      }
    }

    /* ===== Chevron buttons ===== */
    .work-chevron {
      cursor: pointer;
      /* Color transitions for hover fill, transform for active press */
      transition: background-color 200ms ease-out,
                  color 200ms ease-out,
                  transform 100ms ease-out;
    }
    /* Disabled: opaque, non-interactive — hover must not fire */
    .work-chevron:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }
    /* Hover: fill with ink, flip icon to cream — fine-pointer only */
    @media (hover: hover) {
      .work-chevron:not(:disabled):hover {
        background-color: #0F172A; /* ink-900 */
        color: #F8FAFC;            /* bone-50 */
      }
    }
    /* Active: scale down 5%, 100ms override */
    .work-chevron:not(:disabled):active {
      transform: scale(0.95);
      transition-duration: 100ms;
    }
    /* Focus: suppress default browser outline on mouse click */
    .work-chevron:focus { outline: none; }
    /* Focus-visible: keyboard-only ring, ink color, no rust */
    .work-chevron:focus-visible {
      outline: 2px solid #0F172A;
      outline-offset: 2px;
    }

    /* Bleed wrapper: negative margins cancel the section's horizontal padding
       so the card row spans full viewport width, while the heading above stays
       inside the padded content area (matching all other sections). */
    .work-row-bleed {
      margin-left: -1.5rem;   /* cancels section px-6 */
      margin-right: -1.5rem;
    }
    @media (min-width: 768px) {
      .work-row-bleed { margin-left: -3rem; margin-right: -3rem; }  /* cancels md:px-12 */
    }
    @media (min-width: 1024px) {
      .work-row-bleed { margin-left: -5rem; margin-right: -5rem; }  /* cancels lg:px-20 */
    }

    /* Chevron row: right-aligned below the card row.
       justify-end is NOT in the purged Tailwind build, so handled here.
       No padding-right — section's own px-* provides the right gutter. */
    .work-chevron-row {
      justify-content: flex-end; /* right-align within the flex row */
      gap: 12px;
      margin-top: 32px;
    }

    /* ===== Backdrop: background-color transition only =====
       Enter 20ms slower than the modal enter so the dim layer "sets"
       before the panel blooms up — creates the Apple depth-layer feel. */
    .work-backdrop-enter       { transition: background-color 500ms cubic-bezier(0.22, 1, 0.36, 1); }
    .work-backdrop-enter-start { background-color: rgba(15, 23, 42, 0)   !important; }
    .work-backdrop-enter-end   { background-color: rgba(15, 23, 42, 0.6) !important; }
    .work-backdrop-leave       { transition: background-color 240ms cubic-bezier(0.4, 0, 1, 1); }
    .work-backdrop-leave-start { background-color: rgba(15, 23, 42, 0.6) !important; }
    .work-backdrop-leave-end   { background-color: rgba(15, 23, 42, 0)   !important; }

    /* ===== Modal enter keyframe — Apple spring =====
       scale(0.94) + 16px rise → full size. The spring curve gives
       that characteristic Apple "bloom" without overshooting. */
    @keyframes workModalIn {
      from { opacity: 0; transform: scale(0.94) translateY(16px); }
      to   { opacity: 1; transform: scale(1)    translateY(0); }
    }

    /* ===== Modal leave — soft recession ===== */
    .work-modal-leave       { transition: opacity 240ms cubic-bezier(0.4, 0, 1, 1),
                                          transform 240ms cubic-bezier(0.4, 0, 1, 1); }
    .work-modal-leave-start { opacity: 1; transform: scale(1); }
    .work-modal-leave-end   { opacity: 0; transform: scale(0.94); }

    /* ===== FAQ accordion ===== */
    .faq-row {
      border-top: 1px solid rgba(15, 23, 42, 0.10);
    }
    .faq-row:last-child {
      border-bottom: 1px solid rgba(15, 23, 42, 0.10);
    }
    .faq-icon {
      color: #0a0907;
      font-weight: 300;
      transition: color 0.3s ease;
    }
    .faq-row button:hover .faq-icon {
      color: #0369A1;
    }

    /* ===== Case Study Modal ===== */

    /* Remove padding when the modal is showing a case study —
       each section handles its own padding internally. */
    .work-modal--case-study {
      padding: 0;
      background: #f0e8d9;
    }
    /* Keep close button always visible on desktop (case study scrolls far) */
    .work-modal--case-study .work-modal-close-bar {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
    }
    /* Keep close button visible on desktop hover states */
    .work-modal--case-study .work-modal-close {
      background: rgba(240, 232, 217, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-color: rgba(15, 23, 42, 0.25);
    }

    /* Shared eyebrow used across all sections */
    .cs-eyebrow {
      font-family: 'Manrope', sans-serif;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: rgba(15, 23, 42, 0.5);
    }

    /* Section fade-in — IntersectionObserver adds .cs-visible */
    .cs-section-fade {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 600ms cubic-bezier(0.16, 1, 0.3, 1),
                  transform 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cs-section-fade.cs-visible {
      opacity: 1;
      transform: translateY(0);
    }
    @media (prefers-reduced-motion: reduce) {
      .cs-section-fade { opacity: 1; transform: none; transition: none; }
    }

    /* ---- Section 1: Hero ---- */
    .cs-hero {
      position: relative;
      min-height: 90vh;
      min-height: 90dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      background: #0F172A;
    }
    @media (max-width: 767px) {
      .cs-hero { min-height: 70vh; min-height: 70dvh; }
    }
    .cs-hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.65;
    }
    .cs-hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15,23,42,0.75) 0%, transparent 60%);
      pointer-events: none;
    }
    .cs-hero-content {
      position: relative;
      z-index: 1;
      padding: 48px 56px;
      color: #F8FAFC;
    }
    @media (max-width: 767px) {
      .cs-hero-content { padding: 32px 24px; }
    }
    .cs-hero-eyebrow {
      font-family: 'Manrope', sans-serif;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: rgba(248, 250, 252, 0.55);
      margin-bottom: 16px;
    }
    .cs-hero-tagline {
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.75rem, 4vw, 3rem);
      line-height: 1.2;
      color: #F8FAFC;
      max-width: 700px;
      margin-bottom: 40px;
    }
    .cs-hero-meta {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
    }
    .cs-hero-meta-item { display: flex; flex-direction: column; gap: 4px; }
    .cs-hero-meta-label {
      font-family: 'Manrope', sans-serif;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: rgba(248, 250, 252, 0.45);
    }
    .cs-hero-meta-value {
      font-family: 'Manrope', sans-serif;
      font-size: 0.8125rem;
      color: rgba(248, 250, 252, 0.85);
    }

    /* ---- Section 2: Brief ---- */
    .cs-brief {
      background: #f0e8d9;
      padding: 80px 56px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 64px;
      align-items: start;
    }
    @media (max-width: 767px) {
      .cs-brief { grid-template-columns: 1fr; gap: 40px; padding: 60px 24px; }
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      .cs-brief { grid-template-columns: 220px 1fr; gap: 48px; padding: 60px 40px; }
    }
    .cs-brief-left-eyebrow {
      font-family: 'Manrope', sans-serif;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: rgba(15, 23, 42, 0.5);
      margin-bottom: 48px;
    }
    .cs-brief-stats { display: flex; flex-direction: column; gap: 32px; }
    .cs-brief-stat-label {
      font-family: 'Manrope', sans-serif;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: rgba(15, 23, 42, 0.45);
    }
    .cs-brief-stat-value {
      font-family: 'Fraunces', serif;
      font-size: 2.25rem;
      line-height: 1;
      color: #0F172A;
      margin-top: 4px;
    }
    .cs-brief-right { display: flex; flex-direction: column; gap: 24px; }
    .cs-brief-para {
      font-family: 'Manrope', sans-serif;
      font-size: 1.0625rem;
      line-height: 1.7;
      color: rgba(15, 23, 42, 0.8);
    }

    /* ---- Section 3: System ---- */
    .cs-system {
      background: #e8dece;
      padding: 80px 56px;
    }
    @media (max-width: 767px) { .cs-system { padding: 60px 24px; } }
    @media (min-width: 768px) and (max-width: 1023px) { .cs-system { padding: 60px 40px; } }
    .cs-system-headline {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      line-height: 1.2;
      color: #0F172A;
      margin-top: 16px;
      margin-bottom: 48px;
    }
    .cs-system-palette {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 767px) { .cs-system-palette { grid-template-columns: repeat(2, 1fr); } }
    .cs-palette-swatch {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1px solid rgba(15, 23, 42, 0.08);
    }
    .cs-palette-name {
      font-family: 'Manrope', sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(15, 23, 42, 0.6);
      margin-top: 8px;
    }
    .cs-palette-hex {
      font-family: 'Manrope', sans-serif;
      font-size: 0.65rem;
      color: rgba(15, 23, 42, 0.4);
      margin-top: 2px;
    }
    .cs-system-type { display: flex; gap: 16px; margin-top: 48px; flex-wrap: wrap; }
    .cs-type-item {
      flex: 1;
      min-width: 180px;
      background: rgba(15, 23, 42, 0.04);
      border-radius: 8px;
      padding: 24px;
    }
    .cs-type-sample {
      font-family: 'Fraunces', serif;
      font-size: 3rem;
      line-height: 1;
      color: #0F172A;
    }
    .cs-type-name {
      font-family: 'Manrope', sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(15, 23, 42, 0.5);
      margin-top: 12px;
    }
    .cs-type-spec {
      font-family: 'Manrope', sans-serif;
      font-size: 0.75rem;
      color: rgba(15, 23, 42, 0.6);
      margin-top: 4px;
    }

    /* ---- Section 4: Pages (pin-scroll) ---- */
    /* Outer: provides scroll distance for the sticky inner on desktop */
    @media (min-width: 1024px) {
      .cs-pages-outer { height: calc(5 * 90vh); }
    }
    /* Sticky: pins within the modal's scroll container on desktop */
    @media (min-width: 1024px) {
      .cs-pages-sticky {
        position: sticky;
        top: 0;
        height: 90vh;
        overflow: hidden;
      }
    }
    /* Mobile: normal flow, no sticky */
    @media (max-width: 1023px) {
      .cs-pages-sticky { position: static; height: auto; overflow: visible; }
    }

    /* Header floats above the slides on desktop, flows normally on mobile */
    .cs-pages-header {
      padding: 40px 56px 24px;
      display: flex;
      align-items: baseline;
      gap: 24px;
    }
    @media (min-width: 1024px) {
      .cs-pages-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        background: linear-gradient(to bottom, rgba(240,232,217,0.96) 0%, transparent 100%);
        padding: 32px 56px 48px;
      }
    }
    @media (max-width: 767px) {
      .cs-pages-header { padding: 40px 24px 16px; }
    }
    .cs-pages-scroll-hint {
      font-family: 'Manrope', sans-serif;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: rgba(15, 23, 42, 0.4);
    }
    @media (max-width: 1023px) {
      .cs-pages-scroll-hint { display: none; }
    }

    /* Slides track: flex row on desktop, column on mobile */
    .cs-slides-track {
      display: flex;
      width: 500%; /* 5 slides, each = 1/5 = 100% of sticky container */
      height: 100%;
    }
    @media (max-width: 1023px) {
      .cs-slides-track { width: 100%; flex-direction: column; height: auto; }
    }
    .cs-slide {
      width: 20%; /* 1/5 of 500%-wide track = 100% of sticky width */
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    @media (max-width: 1023px) {
      .cs-slide { width: 100%; height: auto; min-height: 70dvh; padding: 20px; }
    }
    .cs-slide-img {
      max-width: 75%;
      max-height: 85%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 16px 48px -8px rgba(15, 23, 42, 0.15);
    }
    @media (max-width: 1023px) {
      .cs-slide-img { max-width: 92%; max-height: 80vh; width: auto; }
    }
    .cs-slide-caption {
      font-family: 'Manrope', sans-serif;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: rgba(15, 23, 42, 0.45);
      margin-top: 24px;
      text-align: center;
    }

    /* Progress indicator: dots + counter, desktop only */
    .cs-progress {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
    }
    @media (max-width: 1023px) { .cs-progress { display: none; } }
    .cs-progress-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.18);
      transition: background 300ms ease-out, transform 300ms ease-out;
    }
    .cs-progress-dot.cs-dot-active {
      background: #0F172A;
      transform: scale(1.3);
    }
    .cs-progress-counter {
      font-family: 'Manrope', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      color: rgba(15, 23, 42, 0.4);
      margin-left: 8px;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Section 5: Outcome ---- */
    .cs-outcome {
      background: #f0e8d9;
      min-height: 70dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 56px;
    }
    @media (max-width: 767px) { .cs-outcome { min-height: 60dvh; padding: 60px 24px; } }
    .cs-outcome-statement {
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.75rem, 3.5vw, 2.5rem);
      line-height: 1.3;
      color: #0F172A;
      max-width: 720px;
      margin: 16px 0 40px;
    }
    @media (max-width: 767px) {
      .cs-outcome-statement { font-size: clamp(1.25rem, 5.5vw, 1.75rem); }
    }
    .cs-outcome-cta {
      display: inline-block;
      padding: 11px 28px;
      border: 1px solid rgba(15, 23, 42, 0.6);
      border-radius: 2px;
      font-family: 'Manrope', sans-serif;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: #0F172A;
      text-decoration: none;
      transition: background-color 250ms ease-out, color 250ms ease-out, border-color 250ms ease-out;
      cursor: pointer;
    }
    @media (hover: hover) {
      .cs-outcome-cta:hover {
        background-color: #0F172A;
        color: #F8FAFC;
        border-color: #0F172A;
      }
    }

    /* ---- Section 6: Close / Next ---- */
    .cs-close {
      background: #0F172A;
      min-height: 60dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 56px;
      position: relative;
      color: #F8FAFC;
    }
    @media (max-width: 767px) { .cs-close { padding: 60px 24px; } }
    .cs-close-wordmark {
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;
      font-size: 1.125rem;
      color: rgba(248, 250, 252, 0.6);
      margin-bottom: 20px;
    }
    .cs-close-divider {
      width: 60px;
      height: 1px;
      background: rgba(248, 250, 252, 0.25);
      margin: 0 auto 40px;
    }
    .cs-close-context {
      font-family: 'Manrope', sans-serif;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(248, 250, 252, 0.5);
      margin-bottom: 24px;
    }
    /* Next case study thumbnail card */
    .cs-next-card {
      max-width: 380px;
      width: 100%;
      margin: 0 auto 40px;
      background: rgba(245, 241, 234, 0.04);
      border: 1px solid rgba(245, 241, 234, 0.1);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      cursor: pointer;
      transition: background-color 200ms ease, border-color 200ms ease;
      text-align: left;
      color: inherit;
    }
    @media (hover: hover) {
      .cs-next-card:hover {
        background: rgba(245, 241, 234, 0.08);
        border-color: rgba(245, 241, 234, 0.2);
      }
      .cs-next-card:hover .cs-next-card-arrow {
        transform: translateX(4px);
      }
    }
    @media (max-width: 1023px) {
      .cs-next-card { padding: 14px; gap: 16px; }
    }
    .cs-next-card-thumb {
      width: 80px;
      height: 100px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }
    @media (max-width: 1023px) {
      .cs-next-card-thumb { width: 70px; height: 88px; }
    }
    .cs-next-card-text {
      flex: 1;
      min-width: 0;
    }
    .cs-next-card-eyebrow {
      font-family: 'Manrope', sans-serif;
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(248, 250, 252, 0.5);
      margin-bottom: 6px;
    }
    .cs-next-card-name {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.5rem;
      line-height: 1.2;
      color: #F8FAFC;
      margin-bottom: 4px;
    }
    @media (max-width: 1023px) {
      .cs-next-card-name { font-size: 1.25rem; }
    }
    .cs-next-card-tagline {
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;
      font-size: 0.75rem;
      color: rgba(248, 250, 252, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cs-next-card-arrow {
      font-size: 1.25rem;
      color: rgba(248, 250, 252, 0.4);
      margin-left: auto;
      flex-shrink: 0;
      transition: transform 200ms ease;
    }
    /* End-of-list fallback: "All work" centered link */
    .cs-close-all-work {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 2rem;
      line-height: 1.2;
      color: #F8FAFC;
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
      background: none;
      border: none;
      cursor: pointer;
      color: inherit;
      margin-bottom: 40px;
      transition: opacity 200ms ease;
    }
    @media (hover: hover) { .cs-close-all-work:hover { opacity: 0.7; } }
    .cs-close-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Manrope', sans-serif;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: rgba(248, 250, 252, 0.28);
      white-space: nowrap;
    }
  </style>
</head>

<body
  x-data="smoova()"
  x-init="init()"
  :data-lang="lang"
  class="relative min-h-screen overflow-x-hidden"
>

<a href="#main"
   class="sr-only focus-visible:not-sr-only focus-visible:absolute focus-visible:top-3 focus-visible:left-3 focus-visible:z-50 focus-visible:px-4 focus-visible:py-2 focus-visible:bg-bone-50 focus-visible:text-ink-900 focus-visible:rounded-md focus-visible:font-medium">
  <span x-text="lang === 'en' ? 'Skip to content' : 'Naar inhoud'"></span>
</a>

<!-- ============== NAV ============== -->
<nav class="absolute top-0 left-0 right-0 z-30 px-6 md:px-12 lg:px-20 py-6 flex items-center justify-between">
  <a href="#" class="flex items-center gap-2 group">
    <span class="font-display text-2xl font-medium tracking-tight text-bone-50">smoova</span>
    <span aria-hidden="true" class="italic-display text-champ-400 text-2xl">.</span>
  </a>

  <div class="flex items-center gap-6 md:gap-8">
    <div role="group" aria-label="Language" class="flex items-center gap-1 text-sm text-bone-400">
      <button @click="lang = 'nl'"
              :aria-pressed="lang === 'nl' ? 'true' : 'false'"
              aria-label="Nederlands"
              :class="lang === 'nl' ? 'text-bone-50' : 'hover:text-bone-100'"
              class="px-3 py-2 min-w-[44px] min-h-[44px] flex items-center justify-center transition-colors rounded-sm">NL</button>
      <span aria-hidden="true" class="text-bone-400/40">/</span>
      <button @click="lang = 'en'"
              :aria-pressed="lang === 'en' ? 'true' : 'false'"
              aria-label="English"
              :class="lang === 'en' ? 'text-bone-50' : 'hover:text-bone-100'"
              class="px-3 py-2 min-w-[44px] min-h-[44px] flex items-center justify-center transition-colors rounded-sm">EN</button>
    </div>

    <a href="#contact" class="hidden sm:inline-block text-sm text-bone-100 link-underline" x-text="t.nav.cta"></a>
  </div>
</nav>

<main id="main">

<!-- ============== HERO ============== -->
<header class="relative overflow-hidden min-h-screen bg-ink-900">

  <!-- Full-bleed cinematic storefront: emotional anchor, not the reading surface. -->
  <div class="absolute inset-0 z-0">
    <img src="smoova_21_1_assets/hero/hero-2-opera.png"
         class="hero-slide"
         fetchpriority="high" loading="eager" decoding="async"
         alt="" />
    <img src="smoova_21_1_assets/hero/hero-2-rooftop.jpg"
         class="hero-slide"
         loading="lazy" decoding="async"
         alt="" />
    <img src="smoova_21_1_assets/hero/hero-3-peacock.png"
         class="hero-slide"
         loading="lazy" decoding="async"
         alt="" />
    <img src="smoova_21_1_assets/hero/hero-4-cathedral.jpg"
         class="hero-slide"
         loading="lazy" decoding="async"
         alt="" />
    <img src="smoova_21_1_assets/hero/hero-5-scissors.jpg"
         class="hero-slide"
         loading="lazy" decoding="async"
         alt="" />

    <!-- Mobile: dark overlay so light text reads against any part of the image -->
    <div class="absolute inset-0 bg-navy-900/75 md:hidden"></div>

    <!-- Desktop: strong gradient on the left half so text stays clear of the bright window -->
    <div class="hidden md:block absolute inset-0"
         style="background: linear-gradient(90deg, rgba(15,23,42,0.72) 0%, rgba(15,23,42,0.58) 25%, rgba(15,23,42,0.32) 50%, rgba(15,23,42,0.10) 70%, rgba(15,23,42,0) 85%);"></div>

    <!-- Bottom fade into next section -->
    <div class="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-navy-900 to-transparent"></div>
  </div>

  <!-- Content layer (LEFT only on desktop, full-width on mobile) -->
  <div class="relative z-10 min-h-screen flex flex-col justify-between px-6 md:px-12 lg:px-20 pt-32 md:pt-28 pb-20 md:pb-24 max-w-7xl mx-auto">

    <!-- Eyebrow -->
    <div class="flex items-center gap-3 text-xs tracking-[0.2em] uppercase" style="color: #F0E8D9;">
      <span class="w-8 h-px" style="background: #F0E8D9;"></span>
      <span x-text="t.hero.eyebrow"></span>
    </div>

    <!-- Block: headline + subhead + CTAs (constrained to ~50% on desktop, full on mobile) -->
    <div class="md:max-w-[46%] lg:max-w-[42%]">

      <!-- Headline -->
      <h1 :key="lang"
          class="font-display font-medium text-5xl sm:text-6xl md:text-6xl lg:text-7xl leading-[1.02] tracking-tight text-bone-50 mt-12 md:mt-0 mb-8 md:mb-10">
        <template x-if="lang === 'nl'">
          <div>
            <span class="line-mask"><span style="animation-delay: 0.15s">Jouw salon.</span></span>
            <span class="line-mask"><span style="animation-delay: 0.30s">Jouw boekingen.</span></span>
            <span class="line-mask"><span class="italic-display text-rust-600 third-line-rotate" style="animation-delay: 0.50s" x-text="heroVariants[lang][heroVariantIndex]"></span></span>
          </div>
        </template>
        <template x-if="lang === 'en'">
          <div>
            <span class="line-mask"><span style="animation-delay: 0.15s">Your salon.</span></span>
            <span class="line-mask"><span style="animation-delay: 0.30s">Your bookings.</span></span>
            <span class="line-mask"><span class="italic-display text-rust-600 third-line-rotate" style="animation-delay: 0.50s" x-text="heroVariants[lang][heroVariantIndex]"></span></span>
          </div>
        </template>
      </h1>

      <!-- Subhead -->
      <p class="text-base md:text-lg lg:text-xl text-bone-100/95 leading-relaxed font-light max-w-xl mb-10 md:mb-12"
         x-text="t.hero.sub"></p>

      <!-- CTAs -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center gap-5">
        <a href="#contact"
           class="cta-primary group inline-flex items-center gap-3 px-7 py-4 bg-bone-50 text-ink-900 rounded-full text-sm font-medium hover:bg-rust-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-rust-600">
          <span x-text="t.hero.ctaPrimary"></span>
          <svg aria-hidden="true" focusable="false" class="w-4 h-4 transition-transform group-hover:translate-x-1" viewBox="0 0 16 16" fill="none">
            <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a href="#calculator" class="group inline-flex items-center gap-2 px-2 py-4 text-sm text-bone-100 link-underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-rust-600 rounded-sm">
          <span x-text="t.hero.ctaSecondary"></span>
          <svg aria-hidden="true" focusable="false" class="w-4 h-4 text-rust-600 transition-transform group-hover:translate-y-1" viewBox="0 0 16 16" fill="none">
            <path d="M8 3v10M4 9l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>
  </div>
</header>

<!-- ============== SELECTED WORK ============== -->
<section id="selected-work" class="relative z-10 px-6 md:px-12 lg:px-20 py-20 md:py-28 bg-paper-50">

  <!-- Section header: inherits section px-* padding, same as Compare/Pricing -->
  <div class="mb-10 md:mb-12">
    <div class="text-xs tracking-[0.2em] uppercase text-ink-700 mb-5 flex items-center gap-3">
      <span class="w-8 h-px bg-ink-700"></span>
      <span class="font-caps" x-text="t.selectedWork.eyebrow"></span>
    </div>
    <h2 class="font-display font-medium text-3xl md:text-5xl lg:text-6xl leading-[1.05] tracking-tight text-ink-900"
        x-text="t.selectedWork.headline"></h2>
  </div>

  <!-- Bleed wrapper: negative margins cancel section padding so card row spans full viewport width -->
  <div class="work-row-bleed">
  <!-- Card row: scroll padding-left restores the gutter so first card aligns with heading -->
  <div x-ref="workRow"
       class="work-row"
       @scroll.passive="updateWorkScroll()">
    <template x-for="card in workCards" :key="card.id">
      <div class="work-card"
           @click="openWork(card, $event)"
           role="button"
           tabindex="0"
           @keydown.enter.prevent="openWork(card, $event)"
           @keydown.space.prevent="openWork(card, $event)"
           @mouseenter="card.status === 'live' && card.caseStudy?.hero?.heroImage && (new Image().src = card.caseStudy.hero.heroImage)"
           :aria-label="(lang === 'nl' ? 'Bekijk project: ' : 'View project: ') + card.card.headline">

        <!-- Full-bleed background: real image or ink placeholder -->
        <div class="absolute inset-0 bg-ink-800"
             :style="card.card.image
               ? 'background-image:url(\'' + card.card.image + '\');background-size:cover;background-position:' + card.card.objectPosition
               : ''">
          <!-- Placeholder: centered card number when no image supplied -->
          <template x-if="!card.card.image">
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none select-none">
              <span class="work-card-num font-display font-medium"
                    x-text="String(card.id).padStart(2,'0')"></span>
            </div>
          </template>
        </div>

        <!-- + button: absolutely pinned to bottom-right corner -->
        <div class="work-card-plus work-card-plus-btn w-10 h-10 rounded-full bg-ink-900 flex items-center justify-center pointer-events-auto"
             aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 3v10M3 8h10" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>

      </div>
    </template>
  </div>
  </div><!-- /.work-row-bleed -->

  <!-- Prev/next chevrons: desktop only (mobile uses swipe) -->
  <!-- hidden md:flex: responsive display toggle (Tailwind). Layout handled by .work-chevron-row (justify-end not in purged build). -->
  <div class="hidden md:flex work-chevron-row">
    <button
      @click="scrollWork(-1)"
      :disabled="workAtStart"
      class="work-chevron w-10 h-10 rounded-full border border-ink-700 bg-paper-50 flex items-center justify-center text-ink-900"
      :aria-label="lang === 'nl' ? 'Vorige' : 'Previous'">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button
      @click="scrollWork(1)"
      :disabled="workAtEnd"
      class="work-chevron w-10 h-10 rounded-full border border-ink-700 bg-paper-50 flex items-center justify-center text-ink-900"
      :aria-label="lang === 'nl' ? 'Volgende' : 'Next'">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

</section>

<!-- ============== CREDIBILITY STRIP ============== -->
<div class="relative z-10 py-12 md:py-14 border-y border-ink-700/15 bg-paper-50">
  <div class="text-center mb-6 md:mb-8">
    <span class="font-caps text-[0.7rem] md:text-xs uppercase tracking-[0.3em] text-ink-500" x-text="t.credibility.title"></span>
  </div>
  <div class="marquee-wrap">
    <div class="marquee">
      <template x-for="i in 3" :key="i">
        <div class="flex items-center gap-12 md:gap-14">
          <span class="font-caps text-base md:text-lg tracking-[0.18em] uppercase text-ink-500 font-medium">Huawei</span>
          <span aria-hidden="true" class="text-ink-500/40 text-sm">✦</span>
          <span class="font-caps text-base md:text-lg tracking-[0.18em] uppercase text-ink-500 font-medium">Snapp</span>
          <span aria-hidden="true" class="text-ink-500/40 text-sm">✦</span>
          <span class="font-caps text-base md:text-lg tracking-[0.18em] uppercase text-ink-500 font-medium">Swappie</span>
          <span aria-hidden="true" class="text-ink-500/40 text-sm">✦</span>
          <span class="font-caps text-base md:text-lg tracking-[0.18em] uppercase text-ink-500 font-medium">Wehkamp</span>
          <span aria-hidden="true" class="text-ink-500/40 text-sm">✦</span>
          <span class="font-caps text-base md:text-lg tracking-[0.18em] uppercase text-ink-500 font-medium">Tinka</span>
          <span aria-hidden="true" class="text-ink-500/40 text-sm">✦</span>
          <span class="font-caps text-base md:text-lg tracking-[0.18em] uppercase text-ink-500 font-medium">team.blue</span>
          <span aria-hidden="true" class="text-ink-500/40 text-sm">✦</span>
          <span class="font-caps text-base md:text-lg tracking-[0.18em] uppercase text-ink-500 font-medium">Hypernode</span>
          <span aria-hidden="true" class="text-ink-500/40 text-sm">✦</span>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- ============== CALCULATOR ============== -->
<section id="calculator" class="relative z-10 px-6 md:px-12 lg:px-20 py-16 md:py-24 bg-paper-100 min-h-screen">
  <div class="max-w-6xl mx-auto">
    <div class="mb-20">
      <div class="text-xs tracking-[0.2em] uppercase text-ink-700 mb-6 flex items-center gap-3">
        <span class="w-8 h-px bg-ink-700"></span>
        <span x-text="t.calc.eyebrow"></span>
      </div>
      <h2 class="font-display font-light text-3xl md:text-5xl lg:text-6xl leading-[1.05] tracking-tight max-w-3xl">
        <template x-if="lang === 'nl'">
          <span>Wat kost Treatwell <span class="italic-display text-rust-600">jou écht?</span></span>
        </template>
        <template x-if="lang === 'en'">
          <span>What is Treatwell <span class="italic-display text-rust-600">actually costing you?</span></span>
        </template>
      </h2>
    </div>

    <div class="grid lg:grid-cols-[5fr_1px_7fr] gap-10 lg:gap-16 xl:gap-20 items-start">

      <!-- INPUTS column with × between sliders -->
      <div class="space-y-5">
        <div class="font-caps text-[0.7rem] tracking-[0.22em] uppercase text-ink-500 pb-2 border-b border-ink-700/15" x-text="lang === 'nl' ? 'Jouw cijfers' : 'Your numbers'"></div>

        <!-- Slider 1 — bookings -->
        <div>
          <div class="flex items-baseline justify-between gap-4 mb-2">
            <div class="font-display text-2xl md:text-3xl text-ink-900 tabular leading-none" x-text="displayedBookings"></div>
            <label for="calc-bookings" class="font-caps text-[0.7rem] tracking-[0.18em] uppercase text-ink-500 text-right leading-tight" x-text="t.calc.inputBookings"></label>
          </div>
          <input id="calc-bookings" type="range" min="20" max="500" step="10" x-model.number="bookings"
                 :style="`background: ${sliderFill(bookings, 20, 500)};`"
                 :aria-valuetext="bookings + (lang === 'nl' ? ' boekingen per maand' : ' bookings per month')" />
          <div class="flex justify-between text-[0.65rem] text-ink-500 mt-2 font-display tabular"><span>20</span><span>500</span></div>
        </div>

        <!-- × ledger mark -->
        <div aria-hidden="true" class="font-display italic text-xl text-ink-500/55 text-center select-none -my-1">×</div>

        <!-- Slider 2 — avg price -->
        <div>
          <div class="flex items-baseline justify-between gap-4 mb-2">
            <div class="font-display text-2xl md:text-3xl text-ink-900 tabular leading-none">€<span x-text="displayedAvgPrice"></span></div>
            <label for="calc-price" class="font-caps text-[0.7rem] tracking-[0.18em] uppercase text-ink-500 text-right leading-tight" x-text="t.calc.inputPrice"></label>
          </div>
          <input id="calc-price" type="range" min="25" max="250" step="5" x-model.number="avgPrice"
                 :style="`background: ${sliderFill(avgPrice, 25, 250)};`"
                 :aria-valuetext="'€' + avgPrice + (lang === 'nl' ? ' gemiddelde behandelprijs' : ' average treatment price')" />
          <div class="flex justify-between text-[0.65rem] text-ink-500 mt-2 font-display tabular"><span>€25</span><span>€250</span></div>
        </div>

        <!-- × ledger mark -->
        <div aria-hidden="true" class="font-display italic text-xl text-ink-500/55 text-center select-none -my-1">×</div>

        <!-- Slider 3 — commission -->
        <div>
          <div class="flex items-baseline justify-between gap-4 mb-2">

    // Swipe gesture state

    // Case study state

    _sectionObserver: null, // IntersectionObserver for section fade-ins

    openWork(card, event) {
      // Reset any leftover swipe transform from a previous gesture
      if (this.$refs.workModalEl) this.$refs.workModalEl.style.transform = '';

      this._lastFocus = event?.currentTarget || null;
      this.activeWork = card;
      this.modalVisible = true;

      // Scroll lock: position:fixed + top prevents iOS Safari body scroll-through.
      // Plain overflow:hidden alone lets body scroll on Safari when modal is touched.
      this._savedScrollY = window.scrollY;
      document.body.style.overflow = 'hidden';
      document.body.style.position = 'fixed';
      document.body.style.top = `-${this._savedScrollY}px`;
      document.body.style.width = '100%';

      // Attach non-passive touchmove so we can call preventDefault for drag gestures.
      // passive:false is required — passive listeners cannot call preventDefault.
      if (window.matchMedia('(hover: none)').matches) {
        this._boundTouchMove = (e) => this.onTouchMove(e);
        window.addEventListener('touchmove', this._boundTouchMove, { passive: false });
      }

      // Brief tap cue on the source card: scale to 1.02 for 50ms before modal covers it
      const cardEl = event?.currentTarget;
      if (cardEl && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        requestAnimationFrame(() => {
          cardEl.style.transform = 'scale(1.02)';
          setTimeout(() => { cardEl.style.transform = ''; }, 50);
        });

      // Move focus to close button after modal mounts; init GSAP for live case studies
      this.$nextTick(() => {
        if (this.$refs.workModalClose) this.$refs.workModalClose.focus();
        // Reset modal scroll to top (important for next-project transitions)

    // Close: fade the modal out, then restore the page scroll position AFTER the

    closeWork() {

        document.body.style.position = '';

    onTouchStart(e) {

      this._canDismiss = (this.$refs.workModalEl?.scrollTop ?? 0) === 0;
      this.swipeLockDir = null;
      this.dragOffsetY = 0;
      this.dragOffsetX = 0;
      this.isDragging = true;

    onTouchMove(e) {

      }

      const modal = this.$refs.workModalEl;
      if (!modal || !this.swipeLockDir) return;

      if (this.swipeLockDir === 'vertical' && deltaY > 0 && this._canDismiss) {
        e.preventDefault(); // stop modal from scrolling while dragging to dismiss
        this.dragOffsetY = deltaY;
        modal.style.transition = 'none';
        modal.style.transform = `translateY(${deltaY * 0.6}px)`; // 0.6 = drag resistance
      } else if (this.swipeLockDir === 'horizontal') {
        e.preventDefault(); // stop vertical scroll while navigating left/right

          if (window.navigator.vibrate) window.navigator.vibrate(10);

          modal.style.transform = 'translateY(100vh)';
          setTimeout(() => { this.closeWork(); }, 300);
        } else {
          // Below threshold — snap back
          modal.style.transition = 'transform 200ms ease-out';
          modal.style.transform = 'translateY(0)';
          setTimeout(() => { modal.style.transition = ''; }, 200);
        }
      } else if (this.swipeLockDir === 'horizontal') {

          if (window.navigator.vibrate) window.navigator.vibrate(10);

          modal.style.transition = 'transform 200ms ease-out';
          modal.style.transform = 'translateX(0)';
          setTimeout(() => { modal.style.transition = ''; }, 200);

        modal.style.transition = 'transform 200ms ease-out';
        modal.style.transform = '';
        setTimeout(() => { modal.style.transition = ''; }, 200);

      this.dragOffsetY = 0;
      this.dragOffsetX = 0;

    // Animate current modal off-screen, swap card, animate new card in.
    // dir: -1 = go to previous, 1 = go to next
    _swipeToWork(dir) {
      const modal = this.$refs.workModalEl;
      if (!modal) return;

      const idx = this.workCards.findIndex(c => c.id === this.activeWork?.id);
      const newIdx = idx + dir;

      if (newIdx < 0 || newIdx >= this.workCards.length) {
        // Edge of list — snap back
        modal.style.transition = 'transform 200ms ease-out';
        modal.style.transform = 'translateX(0)';
        setTimeout(() => { modal.style.transition = ''; }, 200);
        return;
      }

      const exitX  = dir > 0 ? '-100vw' : '100vw';  // current slides out this way
      const enterX = dir > 0 ? '100vw'  : '-100vw'; // new card enters from opposite

      // 1. Slide current modal off — 350ms ease-out
      modal.style.transition = 'transform 350ms ease-out';
      modal.style.transform = `translateX(${exitX})`;

        modal.style.transition = 'none';
        modal.style.transform = `translateX(${enterX})`;

          requestAnimationFrame(() => {
            modal.style.transition = 'transform 350ms ease-out';
            modal.style.transform = 'translateX(0)';
            setTimeout(() => { modal.style.transition = ''; }, 350);
          });
        });
      }, 350);

    trapFocus(e) {
      const modal = this.$refs.workModalEl;
      if (!modal) return;
      const focusable = Array.from(
        modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
      ).filter(el => !el.disabled && el.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0];
      const last  = focusable[focusable.length - 1];
      if (e.shiftKey) {
        if (document.activeElement === first) { e.preventDefault(); last.focus(); }
      } else {
        if (document.activeElement === last)  { e.preventDefault(); first.focus(); }

    scrollWork(dir) {
      const el = this.$refs.workRow;
      if (!el) return;
      const card = el.querySelector('.work-card');
      // Read gap dynamically from computed style — stays correct when CSS changes
      const gap = parseInt(getComputedStyle(el).columnGap) || 32;
      const step = card ? (card.offsetWidth + gap) : 512; // card width + gap
      el.scrollBy({ left: dir * step, behavior: 'smooth' });

      setTimeout(() => this.updateWorkScroll(), 350);

    updateWorkScroll() {
      const el = this.$refs.workRow;
      if (!el) return;

      this.workAtEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 2;
    },

    // Reactive getter: returns the caseStudy object for the currently open card.
    get activeCase() {
      return this.activeWork?.caseStudy || null;
    },

    // Returns the next work card object (following nextProjectId chain), or null.
    getNextCase() {
      const nextId = this.activeWork?.caseStudy?.close?.nextProjectId;
      if (!nextId) return null;
      return this.workCards.find(c => c.id === nextId) || null;
    },

    getSlideBackgroundColor(index) {

    goToNextCase() {
      const nextCard = this.getNextCase();
      if (!nextCard) {
        this.scrollToExhibitH();
        return;
      }
      this._destroyPinScroll();
      const modal = this.$refs.workModalEl;
      // Brief fade-out
      if (modal) { modal.style.transition = 'opacity 150ms ease-out'; modal.style.opacity = '0'; }
      setTimeout(() => {
        this.activeWork = nextCard;

          setTimeout(() => { modal.style.transition = ''; modal.style.opacity = ''; }, 150); }

    // Close the modal and scroll to the Selected Work section.
    // Uses the same 300ms unlock window as closeWork() so the scroll fires
    // immediately after the body lock is removed — no double-scroll jank.
    scrollToExhibitH() {
      this._destroyPinScroll();

      this.modalVisible = false;

        window.removeEventListener('touchmove', this._boundTouchMove);
        this._boundTouchMove = null;
      }

        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.width = '';

    // Set up GSAP ScrollTrigger pin-scroll for Section 4.
    // Only runs on desktop (≥ 1024px), skips if reduced motion is set.
    _initPinScroll() {
      if (!this.activeWork || this.activeWork.status !== 'live') return;
      if (window.innerWidth < 1024) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;

      const modal = this.$refs.workModalEl;
      if (!modal) return;
      const pagesOuter = modal.querySelector('.cs-pages-outer');
      const slidesTrack = modal.querySelector('.cs-slides-track');
      if (!pagesOuter || !slidesTrack) return;

      gsap.registerPlugin(ScrollTrigger);

      // Tell GSAP about our custom scroll container (the modal, not window).
      // getBoundingClientRect reports the modal's visible area as the viewport.
      ScrollTrigger.scrollerProxy(modal, {
        scrollTop(value) {
          if (arguments.length) { modal.scrollTop = value; }
          return modal.scrollTop;
        },
        getBoundingClientRect() {
          const r = modal.getBoundingClientRect();
          return { top: 0, left: 0, width: r.width, height: r.height };

        // Use transform-based pinning inside a custom scroller
        pinType: 'transform'
      });

      // ScrollTrigger needs to know when our custom scroller scrolls
      this._scrollUpdateHandler = () => ScrollTrigger.update();
      modal.addEventListener('scroll', this._scrollUpdateHandler, { passive: true });

      // CSS sticky handles the visual pin; GSAP only scrubs the horizontal translation.
      // xPercent: -80 on a 500%-wide track = -400% of slide width = traverses all 5 slides.
      this._st = gsap.to(slidesTrack, {

          end: 'bottom bottom',

    _destroyPinScroll() {

        if (this._st.scrollTrigger) this._st.scrollTrigger.kill(true);
        this._st.kill();
        this._st = null;
      }
      const modal = this.$refs.workModalEl;
      if (modal && this._scrollUpdateHandler) {
        modal.removeEventListener('scroll', this._scrollUpdateHandler);
        this._scrollUpdateHandler = null;
      }

      if (typeof ScrollTrigger !== 'undefined') {

    _updateProgressDots(progress) {

    _initSectionFadeIns() {

          entries.forEach(entry => {

        this._sectionObserver = obs;

    get monthlyCommission() {

    get yearlySmoovaCost() { return 2500 + (199 * 9); /* year 1: setup + 9 months (3 months free) */ },
    get yearlySavings() { return Math.max(0, this.yearlyCommission - this.yearlySmoovaCost); },

    formatNum(n) { return new Intl.NumberFormat('nl-NL').format(n); },

    // Smoothed displayed values (drift toward bookings/avgPrice/commission via tween)
    displayedBookings: 120,
    displayedAvgPrice: 65,
    displayedCommission: 30,

    // Smoothed displayed monetary values (drift toward computed totals)
    displayedYearly: 0,
    displayedMonthly: 0,
    displayedSavings: 0,

    // Track previous savings for milestone-cross detection
    prevSavings: 0,
    savingsMilestone: false,

    // Slider fill helper (returns CSS gradient string)
    sliderFill(val, min, max) {
      const pct = ((val - min) / (max - min)) * 100;
      return `linear-gradient(to right, #0369A1 0%, #0369A1 ${pct}%, rgba(15, 23, 42, 0.12) ${pct}%, rgba(15, 23, 42, 0.12) 100%)`;
    },

    // Tween a numeric prop to target over `duration` using ease-out-cubic. Respects reduced-motion.
    tweenTo(key, target, duration = 220) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        this[key] = target;
        return;
      }
      const start = this[key];
      const startTime = performance.now();
      const tick = (now) => {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        this[key] = Math.round(start + (target - start) * eased);
        if (t < 1) requestAnimationFrame(tick);
        else this[key] = target;
      };
      requestAnimationFrame(tick);
    },

    // Build digit slots for the tumbler. Pads to fixed width so the layout doesn't jump.
    // `slots` covers the largest expected magnitude (e.g. 7 for amounts up to 9,999,999).
    digitSlots(value, slots = 7) {
      const formatted = this.formatNum(Math.max(0, Math.round(value)));

      // We don't pad with leading characters because they would visibly tumble; we leave the layout
      // free-form (the parent uses inline-flex), so the number simply expands as it grows.
      return formatted.split('').map(c => ({

        isDigit: /\d/.test(c),
        digit: /\d/.test(c) ? parseInt(c, 10) : 0
      }));
    },

    triggerPulse(key) {
      this[key] = false;
      requestAnimationFrame(() => {
        this[key] = true;
        setTimeout(() => { this[key] = false; }, 400);
      });
    },

    init() {
      // Initialize FAQ accordion state - all closed by default, click + to expand
      this.faqOpen = new Array(this.t.faq.items.length).fill(false);

      // Tween displayed slider values toward their actual values for tactile feel
      this.$watch('bookings',   v => this.tweenTo('displayedBookings', v));
      this.$watch('avgPrice',   v => this.tweenTo('displayedAvgPrice', v));
      this.$watch('commission', v => this.tweenTo('displayedCommission', v));

      // Initialize displayed monetary values to current computed totals
      this.displayedYearly  = this.yearlyCommission;
      this.displayedMonthly = this.monthlyCommission;
      this.displayedSavings = this.yearlySavings;

      // Tween displayed monetary values toward computed values (longer duration:
      // monetary deltas are bigger; the tween + the digit-reel transition together feel right)
      this.$watch('yearlyCommission',  v => this.tweenTo('displayedYearly',  v, 380));
      this.$watch('monthlyCommission', v => this.tweenTo('displayedMonthly', v, 380));
      this.$watch('yearlySavings',     v => this.tweenTo('displayedSavings', v, 380));

      // Milestone detection on savings (€10k, €25k, €50k, €100k crossings)
      this.prevSavings = this.yearlySavings;
      this.$watch('yearlySavings', (v) => {
        this.checkMilestone(v, this.prevSavings);
        this.prevSavings = v;
      });

      // Auto-rotate the third headline line; respects prefers-reduced-motion (WCAG 2.2.2),
      // and stops after one full cycle so it cannot animate indefinitely.
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduceMotion) {
        const variants = this.heroVariants.nl;
        let rotations = 0;
        const maxRotations = variants.length - 1; // one full cycle, then rest on a final variant
        setTimeout(() => {
          const tick = setInterval(() => {
            rotations += 1;
            if (rotations > maxRotations) { clearInterval(tick); return; }
            this.heroVariantIndex = (this.heroVariantIndex + 1) % variants.length;
          }, 3000);
        }, 3500);
      }

      // When variant index changes, re-trigger the slide-up animation on the third line
      this.$watch('heroVariantIndex', () => {
        document.querySelectorAll('.third-line-rotate').forEach(el => {
          el.style.animation = 'none';
          // Force reflow so the next animation actually runs
          void el.offsetWidth;
          el.style.animation = 'lineUp 0.9s cubic-bezier(0.19, 1, 0.22, 1) both';
        });
      });

      this.$watch('monthlyCommission', () => this.triggerPulse('pulseM'));
      this.$watch('yearlyCommission', () => this.triggerPulse('pulseY'));
      this.$watch('yearlySavings', () => this.triggerPulse('pulseS'));

      this.$watch('lang', (v) => {
        document.documentElement.setAttribute('lang', v);
      });

      // Initialize Selected Work chevron state once DOM is ready
      this.$nextTick(() => { this.updateWorkScroll(); });
    }
  }
