  <style>
    :root {

      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;

      border-color: rgba(212, 168, 87, 0.35);

    }

  <script>
    function bookPage() {
      return {
        lang: (typeof localStorage !== 'undefined' && ['nl', 'en'].includes(localStorage.getItem('smoovaLang')))
                ? localStorage.getItem('smoovaLang')
                : 'nl',

        calMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
        calToday: new Date(),

        init() {
          this.$watch('lang', v => {
            try { localStorage.setItem('smoovaLang', v); } catch (_) { /* private mode */ }
          });
        },

        get calGrid() {
          const year = this.calMonth.getFullYear();
          const month = this.calMonth.getMonth();
          const firstDay = new Date(year, month, 1);
          const lastDay = new Date(year, month + 1, 0);
          const startWeekday = (firstDay.getDay() + 6) % 7;
          const daysInMonth = lastDay.getDate();
          const prevMonthLast = new Date(year, month, 0).getDate();
          const todayKey = this._dateKey(this.calToday);

          const cells = [];
          for (let i = startWeekday - 1; i >= 0; i--) {
            const d = new Date(year, month - 1, prevMonthLast - i);
            cells.push(this._cell(d, false, todayKey));
          }
          for (let i = 1; i <= daysInMonth; i++) {
            const d = new Date(year, month, i);
            cells.push(this._cell(d, true, todayKey));
          }
          let nextDay = 1;
          while (cells.length < 42) {
            const d = new Date(year, month + 1, nextDay);
            const cell = this._cell(d, false, todayKey);
            cell.isMonthStart = nextDay === 1;
            cells.push(cell);
            nextDay++;
          }
          return cells;
        },
        _dateKey(d) {
          return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        },
        _cell(d, inMonth, todayKey) {
          const today = new Date(this.calToday.getFullYear(), this.calToday.getMonth(), this.calToday.getDate());
          const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
          return {
            date: d, day: d.getDate(), inMonth,
            isToday: this._dateKey(d) === todayKey,
            isPast: dDay < today,
            isWeekend: d.getDay() === 0 || d.getDay() === 6,
            isMonthStart: false
          };
        },
        calMonthLabel() {
          const monthsNL = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
          const monthsEN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
          return (this.lang === 'nl' ? monthsNL : monthsEN)[this.calMonth.getMonth()];
        },
        calNextMonthShortLabel() {
          const monthsNL = ['JAN','FEB','MRT','APR','MEI','JUN','JUL','AUG','SEP','OKT','NOV','DEC'];
          const monthsEN = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
          const nextMonthIdx = (this.calMonth.getMonth() + 1) % 12;
          return (this.lang === 'nl' ? monthsNL : monthsEN)[nextMonthIdx];
        },
        calPrev() {
          this.calMonth = new Date(this.calMonth.getFullYear(), this.calMonth.getMonth() - 1, 1);
        },
        calNext() {
          this.calMonth = new Date(this.calMonth.getFullYear(), this.calMonth.getMonth() + 1, 1);
        },
      };
    }
  </script>
